<!DOCTYPE html>
<!-- ADD NEXT LINE TO ALL HTML -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Create a new record</title>
</head>
<style>
.error{color:red;}

</style>
<body>

<form th:action = "@{/records}" th:object="${newRecord}" method="post">

	<label for="title">Title</label>
	<input type="text" id="title" th:field="*{title}"></input><br>
	<p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="error"></p>
	
	<label for="artist">Artist</label>
	<input type="text" id="artist" th:field="*{artist}"></input><br>
	<p th:if="${#fields.hasErrors('artist')}" th:errors="*{artist}" class="error"></p>
	
	
	<label for="label">Label</label>
	<input type="text" id="label" th:field="*{label}"></input><br>
	<p th:if="${#fields.hasErrors('label')}" th:errors="*{label}" class="error"></p>
	
	
	<label for="released">Year Released</label>
	<input type="number" id="released" th:field="*{released}"></input><br>
	<p th:if="${#fields.hasErrors('released')}" th:errors="*{released}" class="error"></p>
	
	<label for="tracks">Number of tracks</label>
	<input type="text" id="tracks" th:field="*{numTracks}"></input><br>
	<p th:if="${#fields.hasErrors('numTracks')}" th:errors="*{numTracks}" class="error"></p>
	
	<label for="size">Size</label>
	<select th:field="*{size}">
		<option th:value="7">7 Inches</option>
		<option th:value="10">10 Inches</option>
		<option th:value="12">12 Inches</option>
	</select><br>
	
	<label for="damage">Is record damaged</label>
	<input type="checkbox" id="damage" th:field="*{damaged}"></input><br>
	<p th:if="${#fields.hasErrors('damaged')}" th:errors="*{damaged}" class="error"></p>

<button type="Submit">Add new record</button>
</form>



</body>
</html>
